<!doctype html>
<!--
  PROTOTYPE — throwaway. Answers: "What do the Item details, edit and Expired screens look like?"
  Builds on the chosen dashboard (variant D of dashboard-add-item.prototype.html, list view only here).
  Three structurally different ways to open, edit, archive and delete an Item, and to answer the
  Expired choices and the free-trial "Did you keep it?" prompt. Switch with ?variant=X|Y|Z,
  the floating bar, or ← → keys. "Phone / Computer" toggle in the bar.
  All data is fake and in memory; reload resets it. "You" is a Member, not an Admin.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OopsProof Item prototype</title>
<script src="https://cdn.tailwindcss.com/3.4.16?plugins=container-queries"></script>
<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  body { background: #e5e7eb; }
  .frame { transform: translateZ(0); }
</style>
</head>
<body class="font-sans text-slate-900">
<div id="app"></div>

<script>
const { createApp, ref, reactive, computed, watch, onMounted, onUnmounted, provide, inject, h, Transition, TransitionGroup } = Vue;

// ---------- motion: short, smooth, no bounce; off when the phone asks for reduced motion ----------
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = s => reduceMotion ? 0 : s; // seconds
const EASE_IN = 'power2.in', EASE_OUT = 'power3.out';
const FX = {
  fade: { enter: (el, done) => gsap.fromTo(el, { opacity: 0 }, { opacity: 1, duration: T(0.15), ease: EASE_OUT, onComplete: done }),
          leave: (el, done) => gsap.to(el, { opacity: 0, duration: T(0.1), ease: EASE_IN, onComplete: done }) },
  // small menus and the Undo message: rise 6px and fade
  pop: { enter: (el, done) => gsap.fromTo(el, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: T(0.18), ease: EASE_OUT, onComplete: done }),
         leave: (el, done) => gsap.to(el, { opacity: 0, y: 6, duration: T(0.12), ease: EASE_IN, onComplete: done }) },
  // line editors, question box, rows leaving the list: height opens/closes
  collapse: { enter: (el, done) => gsap.fromTo(el, { height: 0, opacity: 0, overflow: 'hidden' }, { height: 'auto', opacity: 1, duration: T(0.22), ease: EASE_OUT, clearProps: 'height,overflow', onComplete: done }),
              leave: (el, done) => gsap.to(el, { height: 0, opacity: 0, overflow: 'hidden', paddingTop: 0, paddingBottom: 0, duration: T(0.2), ease: EASE_IN, onComplete: done }) },
  // bottom sheet: backdrop fades, panel slides up from the bottom
  sheet: { enter: (el, done) => { gsap.fromTo(el, { backgroundColor: 'rgba(0,0,0,0)' }, { backgroundColor: 'rgba(0,0,0,0.4)', duration: T(0.25) });
                                  gsap.fromTo(el.firstElementChild, { yPercent: 100 }, { yPercent: 0, duration: T(0.3), ease: EASE_OUT, onComplete: done }); },
           leave: (el, done) => { gsap.to(el, { backgroundColor: 'rgba(0,0,0,0)', duration: T(0.2) });
                                  gsap.to(el.firstElementChild, { yPercent: 100, duration: T(0.2), ease: EASE_IN, onComplete: done }); } },
};
const fxWrap = (kind, group) => ({ props: ['mode', 'tag'], setup: (props, { slots }) => () =>
  h(group ? TransitionGroup : Transition, { css: false, mode: props.mode, tag: props.tag, onEnter: FX[kind].enter, onLeave: FX[kind].leave }, slots) });
const FxFade = fxWrap('fade'), FxPop = fxWrap('pop'), FxCollapse = fxWrap('collapse'), FxSheet = fxWrap('sheet'), FxRows = fxWrap('collapse', true);
// a tapped button gives a tiny press
const press = e => gsap.fromTo(e.currentTarget, { scale: 0.92 }, { scale: 1, duration: T(0.2), ease: EASE_OUT });
const FX_COMPONENTS = { FxFade, FxPop, FxCollapse, FxSheet, FxRows };

// ---------- fake data + rules ----------
const DAY = 86400000;
const today = new Date(); today.setHours(0, 0, 0, 0);
const plus = n => new Date(today.getTime() + n * DAY);
const daysTo = d => Math.round((d - today) / DAY);
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmt = (d, o = { day: 'numeric', month: 'short' }) => d.toLocaleDateString(undefined, o);
const longDate = d => fmt(d, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
const money = c => c == null ? '' : (c / 100).toLocaleString(undefined, { style: 'currency', currency: 'EUR' });

const CATEGORIES = {
  'Documents': { color: 'bg-indigo-100 text-indigo-700', icon: '📄' }, 'Cards': { color: 'bg-sky-100 text-sky-700', icon: '💳' },
  'Subscriptions': { color: 'bg-violet-100 text-violet-700', icon: '🔁' }, 'Free trials': { color: 'bg-pink-100 text-pink-700', icon: '🎁' },
  'Vehicle': { color: 'bg-amber-100 text-amber-700', icon: '🚗' }, 'Home': { color: 'bg-emerald-100 text-emerald-700', icon: '🏠' },
  'Health': { color: 'bg-rose-100 text-rose-700', icon: '🩺' }, 'Purchases': { color: 'bg-orange-100 text-orange-700', icon: '🛍️' },
  'Travel': { color: 'bg-cyan-100 text-cyan-700', icon: '✈️' }, 'Other': { color: 'bg-slate-100 text-slate-700', icon: '•' },
};
const REMINDER_OPTS = [
  { k: '30m', label: '30 min before', time: true }, { k: '1h', label: '1 hour before', time: true },
  { k: '2h', label: '2 hours before', time: true }, { k: '4h', label: '4 hours before', time: true },
  { k: '1d', label: '1 day before' }, { k: '2d', label: '2 days before' }, { k: '1w', label: '1 week before' },
  { k: '2w', label: '2 weeks before', once: true }, { k: '1mo', label: '1 month before', once: true },
];
// hour Reminders need a time; 2 weeks / 1 month only for one-time Items; weekly Items stop at 2 days (1 week would hit the previous Due date)
const remAllowed = (o, f) => !(o.time && !f.time) && !(o.once && f.recur) && !(f.recur === 'weekly' && o.k === '1w');
const remHint = f => f.recur === 'weekly' ? 'Weekly Items can remind up to 2 days before.' : f.recur ? 'Repeating Items can remind up to 1 week before.' : '';
const remLabel = k => REMINDER_OPTS.find(o => o.k === k)?.label;
const DAY_REMINDER_TIME = '12:00';
const hasDayReminder = r => r.some(k => !REMINDER_OPTS.find(o => o.k === k)?.time);
const RECUR = { '': 'Once', weekly: 'Every week', monthly: 'Every month', yearly: 'Every year' };
const MEMBERS = ['You', 'Anna', 'Max'];
const DEPENDENTS = ['Mia', 'Rex'];

let nextId = 100;
const seed = [
  { name: 'Disney+ free trial', category: 'Free trials', due: 0, price: 899, time: '23:59', reminders: ['1d', '4h'] },
  { name: 'Concert ticket refund', category: 'Purchases', due: -2, price: 6500, notes: 'Ask at the box office, keep the receipt.' },
  { name: 'Gym class', category: 'Health', due: 0, recur: 'weekly', time: '18:30', reminders: ['2h', '30m'] },
  { name: 'Netflix', category: 'Subscriptions', due: 5, recur: 'monthly', price: 1299, shared: true, owners: ['Anna'], lastChangedBy: 'Anna' },
  { name: 'Water bill', category: 'Home', due: 4, recur: 'monthly', price: 3400, shared: true, owners: ['Max'], handledBy: 'Anna' },
  { name: 'Dentist check-up', category: 'Health', due: 9, recur: 'yearly', for: 'Mia', shared: true, owners: ['Anna', 'You'], reminders: ['1w', '1d'] },
  { name: 'Car insurance', category: 'Vehicle', due: 16, recur: 'yearly', price: 48000, shared: true, owners: ['You', 'Anna'], remind: 'owners' },
  { name: 'Passport', category: 'Documents', due: 40, reminders: ['1mo', '1w'], notes: 'Book appointment online first.' },
  { name: 'Spotify', category: 'Subscriptions', due: 22, recur: 'monthly', price: 1199 },
].map(i => ({ id: nextId++, recur: '', time: null, price: null, shared: false, owners: ['You'], for: null, handledBy: null,
  reminders: ['1d'], notes: '', remind: 'family', archived: false, lastChangedBy: null, ...i, due: plus(i.due) }));

const store = reactive({ items: seed, toast: null, log: [], filter: 'all', view: new URLSearchParams(location.search).get('view') || 'list', calMode: 'week', cursor: new Date(today), picked: new Date(today) });
const log = msg => { store.log.unshift(msg); store.log.length = Math.min(store.log.length, 8); };
const toast = (text, undo) => { store.toast = { text, undo }; setTimeout(() => { if (store.toast?.text === text) store.toast = null; }, 4000); };

const isExpired = i => !i.recur && daysTo(i.due) < 0 && !i.handledBy;
const isTrialDay = i => i.category === 'Free trials' && daysTo(i.due) <= 0 && !i.handledBy;
const canRemove = i => !i.shared || i.owners.includes('You'); // Owners or Admins; "You" is not an Admin here
const dayColor = (days, handled) => handled ? { bar: 'bg-slate-200', text: 'text-slate-400' }
  : days <= 0 ? { bar: 'bg-red-500', text: 'text-red-600' } : days <= 7 ? { bar: 'bg-amber-400', text: 'text-amber-600' } : { bar: 'bg-emerald-500', text: 'text-emerald-600' };
function countdown(i) {
  if (i.handledBy) return `Handled by ${i.handledBy}`;
  const d = daysTo(i.due);
  if (d < 0) return `Expired ${-d} day${d === -1 ? '' : 's'} ago`;
  if (d === 0) return 'Due today' + (i.time ? ` at ${i.time}` : '');
  return `Due in ${d} day${d === 1 ? '' : 's'}`;
}
const group = i => daysTo(i.due) <= 0 ? 'today' : daysTo(i.due) <= 7 ? 'week' : 'later';
const active = computed(() => store.items.filter(i => !i.archived && (store.filter === 'all' || (store.filter === 'mine' ? !i.shared : i.shared))).sort((a, b) => a.due - b.due));
const archived = computed(() => store.items.filter(i => i.archived));

// ---------- actions (same rules in every variant) ----------
const A = {
  handled(i) { i.handledBy = i.handledBy ? null : 'You'; log(`${i.name}: ${i.handledBy ? 'Handled' : 'not Handled'}`); },
  archive(i) { i.archived = true; log(`${i.name}: Archived`); toast(`${i.name} archived`, () => { i.archived = false; }); },
  restore(i) { i.archived = false; log(`${i.name}: restored`); },
  remove(i) { const k = store.items.indexOf(i); store.items.splice(k, 1); log(`${i.name}: deleted`); toast(`${i.name} deleted`, () => store.items.splice(k, 0, i)); },
  newDue(i, iso) { i.due = new Date(iso + 'T00:00'); i.handledBy = null; log(`${i.name}: new Due date ${fmt(i.due)}`); },
  makeRepeat(i, recur) { // next Due date counted from the old one
    const d = new Date(i.due);
    while (d < today) recur === 'weekly' ? d.setDate(d.getDate() + 7) : recur === 'monthly' ? d.setMonth(d.getMonth() + 1) : d.setFullYear(d.getFullYear() + 1);
    i.recur = recur; i.due = d; log(`${i.name}: repeats ${recur}, next ${fmt(d)}`);
  },
  keptTrial(i, yes) {
    if (yes) { i.category = 'Subscriptions'; i.name = i.name.replace(/ free trial/i, ''); i.recur = 'monthly'; const d = new Date(i.due); d.setMonth(d.getMonth() + 1); i.due = d; log(`${i.name}: kept, now a monthly Subscription`); }
    else { i.archived = true; log(`${i.name}: not kept, Archived`); toast(`${i.name} archived`, () => { i.archived = false; }); }
  },
  save(i, f) {
    Object.assign(i, { name: f.name, category: f.category, due: new Date(f.due + 'T00:00'), time: f.time || null, recur: f.recur,
      price: f.price ? Math.round(parseFloat(String(f.price).replace(',', '.')) * 100) : null, shared: f.shared, owners: f.shared ? f.owners : ['You'],
      for: f.shared ? f.for : null, remind: f.remind, notes: f.notes, reminders: f.reminders.filter(k => remAllowed(REMINDER_OPTS.find(o => o.k === k), f)), lastChangedBy: 'You' });
    log(`${i.name}: saved`);
  },
};
const formFrom = i => ({ name: i.name, category: i.category, due: isoDate(i.due), time: i.time || '', recur: i.recur, price: i.price ? (i.price / 100).toFixed(2) : '',
  shared: i.shared, owners: [...i.owners], for: i.for, remind: i.remind, notes: i.notes, reminders: [...i.reminders] });

// The lines of the Item sheet, in order; Shared-only lines last.
const sheetLines = i => [
  { k: 'due', label: 'Due date', value: fmt(i.due, { weekday: 'short', day: 'numeric', month: 'long' }) },
  { k: 'time', label: 'Time', value: i.time || 'No time' },
  { k: 'recur', label: 'Repeats', value: RECUR[i.recur] },
  { k: 'rem', label: 'Reminders', value: i.reminders.map(remLabel).join(', ') || 'None', sub: hasDayReminder(i.reminders) ? `day Reminders at ${DAY_REMINDER_TIME}` : null },
  { k: 'price', label: 'Price', value: i.price ? money(i.price) : 'Add price' },
  { k: 'cat', label: 'Category', value: CATEGORIES[i.category].icon + ' ' + i.category },
  { k: 'share', label: 'Family', value: i.shared ? 'Shared' : 'Personal' },
  ...(i.shared ? [
    { k: 'owners', label: 'Owners', value: i.owners.join(', ') },
    { k: 'for', label: 'For', value: i.for || 'Nobody in particular' },
    { k: 'remind', label: 'Remind', value: i.remind === 'owners' ? 'Owners only' : 'Whole family' }] : []),
  { k: 'notes', label: 'Notes', value: i.notes || 'Add notes' },
];
const startOpen = () => store.items.find(i => String(i.id) === new URLSearchParams(location.search).get('open'));
const H = { CATEGORIES, REMINDER_OPTS, RECUR, MEMBERS, DEPENDENTS, store, active, archived, fmt, longDate, money, daysTo, isoDate, remLabel,
  isExpired, isTrialDay, canRemove, sheetLines, remAllowed, remHint, press, dayColor, countdown, group, A, formFrom, today };

// ---------- shared pieces ----------
const CatBadge = { props: ['c', 'size'], setup: () => H,
  template: `<span :class="[CATEGORIES[c].color, size==='lg' ? 'w-14 h-14 text-3xl' : 'w-9 h-9 text-lg']" class="rounded-xl grid place-items-center shrink-0">{{ CATEGORIES[c].icon }}</span>` };

// One list row of the chosen dashboard (variant D): colour bar, countdown, in-place Handled.
const ListRow = { props: ['i', 'selected'], emits: ['pick'], components: { CatBadge }, setup: () => H,
  template: `<div @click="$emit('pick', i)" :class="selected===i ? 'bg-slate-100' : ''" class="flex items-center gap-3 pr-4 py-2.5 cursor-pointer">
    <span :class="dayColor(daysTo(i.due), i.handledBy).bar" class="w-1.5 self-stretch rounded-r-full"></span>
    <CatBadge :c="i.category" />
    <div class="flex-1 min-w-0">
      <div class="font-medium truncate transition-colors duration-200" :class="i.handledBy ? 'line-through text-slate-400' : ''">{{ i.name }}</div>
      <div class="text-xs truncate transition-colors duration-200" :class="dayColor(daysTo(i.due), i.handledBy).text">{{ countdown(i) }}<span class="text-slate-400"> · Due {{ fmt(i.due) }}<span v-if="i.shared"> · 👥 {{ i.owners.join(', ') }}</span></span></div>
    </div>
    <span v-if="isExpired(i) || isTrialDay(i)" class="text-[10px] bg-red-600 text-white rounded-full px-2 py-0.5">{{ isTrialDay(i) ? 'Kept it?' : 'What now?' }}</span>
    <button v-else @click.stop="press($event); A.handled(i)" :class="i.handledBy ? 'bg-slate-100 text-slate-500' : 'border'" class="text-xs rounded-full px-2.5 py-1 shrink-0 transition-colors duration-200">{{ i.handledBy ? 'Undo' : 'Handled' }}</button>
  </div>` };

// The chosen dashboard (variant D): List (Today / This week / Later) or Calendar (week / month, one dot per Due date).
const ItemList = { props: ['selected'], emits: ['pick'], components: { CatBadge, ListRow, ...FX_COMPONENTS }, setup() {
    const showArchived = ref(false);
    const groups = computed(() => [['today', 'Today', 'bg-red-500'], ['week', 'This week', 'bg-amber-400'], ['later', 'Later', 'bg-emerald-500']]
      .map(([k, label, dot]) => ({ k, label, dot, items: active.value.filter(i => group(i) === k) })));
    const sameDay = (a, b) => a.toDateString() === b.toDateString();
    const on = d => active.value.filter(i => sameDay(i.due, d));
    const weekDays = computed(() => { const s = new Date(store.cursor); s.setDate(s.getDate() - (s.getDay() + 6) % 7); return Array.from({ length: 7 }, (_, n) => new Date(s.getFullYear(), s.getMonth(), s.getDate() + n)); });
    const monthDays = computed(() => { const m = new Date(store.cursor.getFullYear(), store.cursor.getMonth(), 1); return Array.from({ length: 42 }, (_, n) => new Date(m.getFullYear(), m.getMonth(), n - (m.getDay() + 6) % 7 + 1)); });
    const calTitle = computed(() => store.calMode === 'month' ? fmt(store.cursor, { month: 'long', year: 'numeric' }) : `${fmt(weekDays.value[0])} – ${fmt(weekDays.value[6])}`);
    const move = n => { const c = new Date(store.cursor); store.calMode === 'month' ? c.setMonth(c.getMonth() + n, 1) : c.setDate(c.getDate() + 7 * n); store.cursor = c; };
    const goToday = () => { store.cursor = new Date(today); store.picked = new Date(today); };
    return { ...H, groups, showArchived, sameDay, on, weekDays, monthDays, calTitle, move, goToday };
  },
  template: `<div><FxFade mode="out-in">
    <div v-if="store.view==='list'" key="list">
      <section v-for="g in groups" :key="g.k">
        <h2 class="px-4 pt-4 pb-1 text-xs font-semibold uppercase tracking-wide flex items-center gap-2"><span :class="g.dot" class="w-2 h-2 rounded-full"></span>{{ g.label }} <span class="text-slate-400">{{ g.items.length }}</span></h2>
        <div v-if="!g.items.length" class="px-4 py-2 text-sm text-slate-400">Nothing here</div>
        <FxRows tag="div"><div v-for="i in g.items" :key="i.id"><slot name="row" :i="i"><ListRow :i="i" :selected="selected" @pick="$emit('pick', $event)" /></slot></div></FxRows>
      </section>
    </div>
    <div v-else key="calendar">
      <div class="px-4 pt-3 flex items-center gap-2">
        <button @click="move(-1)" class="w-8 h-8 rounded-full border">‹</button>
        <div class="font-semibold flex-1 text-center">{{ calTitle }}</div>
        <button @click="move(1)" class="w-8 h-8 rounded-full border">›</button></div>
      <div class="px-4 pt-2 flex items-center justify-between text-sm">
        <button @click="goToday" class="text-slate-500 underline">Today</button>
        <div class="inline-flex bg-slate-100 rounded-full p-1">
          <button v-for="m in [['week','Week'],['month','Month']]" @click="store.calMode=m[0]" :class="store.calMode===m[0] ? 'bg-white shadow' : 'text-slate-500'" class="px-3 py-0.5 rounded-full">{{ m[1] }}</button></div></div>
      <div class="px-2 pt-3">
        <div class="grid grid-cols-7 text-center text-[11px] text-slate-400 mb-1"><span v-for="w in ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']">{{ w }}</span></div>
        <FxFade mode="out-in"><div class="grid grid-cols-7 gap-1" :key="store.calMode + calTitle">
          <button v-for="d in (store.calMode==='week' ? weekDays : monthDays)" @click="store.picked=d"
            :class="[sameDay(d,store.picked) ? 'bg-slate-900 text-white' : sameDay(d,today) ? 'ring-1 ring-slate-900' : 'bg-slate-50',
                     store.calMode==='month' && d.getMonth()!==store.cursor.getMonth() ? 'opacity-30' : '', store.calMode==='week' ? 'min-h-20' : 'min-h-12']"
            class="rounded-xl p-1 flex flex-col items-center">
            <span class="text-sm font-medium">{{ d.getDate() }}</span>
            <span class="flex flex-wrap justify-center gap-0.5 mt-1"><span v-for="i in on(d).slice(0,6)" :class="dayColor(daysTo(i.due), i.handledBy).bar" class="w-2.5 h-2.5 rounded-full"></span></span>
          </button></div></FxFade></div>
      <h3 class="px-4 pt-5 pb-1 text-xs font-semibold uppercase tracking-wide text-slate-500">{{ sameDay(store.picked,today) ? 'Today' : fmt(store.picked,{weekday:'long', day:'numeric', month:'long'}) }}</h3>
      <div v-if="!on(store.picked).length" class="px-4 py-2 text-sm text-slate-400">Nothing on this day</div>
      <FxRows tag="div"><div v-for="i in on(store.picked)" :key="i.id"><slot name="row" :i="i"><ListRow :i="i" :selected="selected" @pick="$emit('pick', $event)" /></slot></div></FxRows>
    </div></FxFade>
    <button @click="showArchived=!showArchived" class="mx-4 mt-6 text-sm text-slate-500 underline">Archived ({{ archived.length }})</button>
    <FxCollapse><div v-if="showArchived" class="mx-4 mt-2 space-y-1">
      <div v-for="i in archived" :key="i.id" class="flex items-center justify-between text-sm text-slate-500 bg-slate-50 rounded-lg px-3 py-2">
        <span>{{ CATEGORIES[i.category].icon }} {{ i.name }}</span><button @click="A.restore(i)" class="underline">Restore</button></div>
      <div v-if="!archived.length" class="text-sm text-slate-400">Nothing archived</div>
    </div></FxCollapse>
  </div>` };

// Full edit form (dashboard's add form, prefilled), plus Shared-Item fields.
const EditForm = { props: ['f'], setup: () => H,
  template: `<div class="space-y-4">
    <label class="block"><span class="text-sm text-slate-500">Name</span><input v-model="f.name" class="mt-1 w-full border rounded-xl px-3 py-2.5" /></label>
    <div><span class="text-sm text-slate-500">Category</span><div class="mt-1 flex flex-wrap gap-2">
      <button v-for="(v,k) in CATEGORIES" @click="f.category=k" :class="f.category===k ? 'ring-2 ring-slate-900 '+v.color : 'bg-slate-50 text-slate-600'" class="px-3 py-1.5 rounded-full text-sm">{{ v.icon }} {{ k }}</button></div></div>
    <div class="grid grid-cols-2 gap-3">
      <label class="block"><span class="text-sm text-slate-500">Due date</span><input type="date" v-model="f.due" class="mt-1 w-full border rounded-xl px-3 py-2.5" /></label>
      <label class="block"><span class="text-sm text-slate-500">Time (optional)</span><input type="time" v-model="f.time" class="mt-1 w-full border rounded-xl px-3 py-2.5" /></label></div>
    <label class="block"><span class="text-sm text-slate-500">Repeats</span><select v-model="f.recur" class="mt-1 w-full border rounded-xl px-3 py-2.5 bg-white"><option v-for="(l,k) in RECUR" :value="k">{{ l }}</option></select></label>
    <div><span class="text-sm text-slate-500">Reminders (pick any)</span><div class="mt-1 flex flex-wrap gap-2">

    const commit = () => { A.save(open.value, draft.value); field.value = null; };
    const toggle = k => { if (field.value === k) return commit(); if (field.value) commit(); startEdit(k); };
    const close = () => { if (field.value) commit(); sheetOpen.value = false; setTimeout(() => { if (!sheetOpen.value) open.value = null; }, T(0.2) * 1000 + 30); };
    watch(() => open.value && (open.value.archived || !store.items.includes(open.value)), gone => gone && close());
    const swipe = reactive({ id: null, x: 0, start: 0 });
    const down = (i, e) => { swipe.id = i.id; swipe.start = e.clientX; swipe.x = 0; };
    const move = e => { if (swipe.id != null) swipe.x = Math.max(-140, Math.min(100, e.clientX - swipe.start)); };
    const up = i => { if (swipe.id !== i.id || swipe.busy) return; const x = swipe.x;
      const done = () => { swipe.id = null; swipe.x = 0; swipe.busy = false; };
      if (Math.abs(x) < 5) { done(); return pick(i); }
      swipe.busy = true;
      if (x < -110 && canRemove(i)) return gsap.to(swipe, { x: -420, duration: T(0.2), ease: EASE_IN, onComplete: () => { A.archive(i); done(); } });
      if (x > 70) A.handled(i);
      gsap.to(swipe, { x: 0, duration: T(0.22), ease: EASE_OUT, onComplete: done }); };
    if (startOpen()) { open.value = startOpen(); sheetOpen.value = true; const e = new URLSearchParams(location.search).get('edit'); if (e) startEdit(e); }
    const ctx = { ...H, open, sheetOpen, field, draft, confirmDel, editing, pick, startEdit, commit, toggle, close, swipe, down, move, up, look: 'banner', withEdit: false };
    provide('sheet', ctx);
    return ctx;
  },
  template: `<Shell title="W · Owner's mix">
    <template #list>
      <div class="px-4 pt-2 text-xs text-slate-400">Swipe right = Handled, left = Archive. Tap to open.</div>
      <ItemList :selected="open"><template #row="{ i }">
        <div class="relative overflow-hidden select-none" @pointermove="move" @pointerup="up(i)" @pointerleave="swipe.id===i.id && up(i)">
          <div class="absolute inset-0 flex justify-between items-center px-5 text-sm text-white" :class="swipe.id===i.id && swipe.x>0 ? 'bg-emerald-500' : 'bg-slate-500'">
            <span>✓ {{ i.handledBy ? 'Undo' : 'Handled' }}</span><span>{{ canRemove(i) ? 'Archive' : 'Owners only' }}</span></div>
          <div @pointerdown="down(i,$event)" :style="{ transform: 'translateX(' + (swipe.id===i.id ? swipe.x : 0) + 'px)' }" :class="open===i ? 'bg-slate-100' : 'bg-white'" class="relative flex items-center gap-3 pr-4 py-2.5 cursor-pointer">
            <span :class="dayColor(daysTo(i.due), i.handledBy).bar" class="w-1.5 self-stretch rounded-r-full"></span>
            <CatBadge :c="i.category" />
            <div class="flex-1 min-w-0"><div class="font-medium truncate" :class="i.handledBy ? 'line-through text-slate-400' : ''">{{ i.name }}</div>
              <div class="text-xs truncate" :class="dayColor(daysTo(i.due), i.handledBy).text">{{ countdown(i) }}<span class="text-slate-400"> · Due {{ fmt(i.due) }}<span v-if="i.shared"> · 👥 {{ i.owners.join(', ') }}</span></span></div></div>
            <span v-if="isExpired(i) || isTrialDay(i)" class="text-[10px] bg-red-600 text-white rounded-full px-2 py-0.5">{{ isTrialDay(i) ? 'Kept it?' : 'What now?' }}</span>
            <button v-else @pointerdown.stop @click.stop="press($event); A.handled(i)" :class="i.handledBy ? 'bg-slate-100 text-slate-500' : 'border'" class="text-xs rounded-full px-2.5 py-1 shrink-0 transition-colors duration-200">{{ i.handledBy ? 'Undo' : 'Handled' }}</button>
          </div>
        </div>
      </template></ItemList>
    </template>
    <template #panel><FxFade mode="out-in"><div v-if="open" :key="open.id" class="max-w-lg mx-auto bg-white rounded-2xl shadow-sm p-6"><YBody /></div><div v-else key="none" class="h-full grid place-items-center text-slate-400">Pick an Item</div></FxFade></template>
    <template #overlay><FxSheet><div v-if="sheetOpen && open" class="@3xl:hidden fixed inset-0 z-20 bg-black/40 flex items-end" @click.self="close()">
      <div class="bg-white w-full rounded-t-3xl p-5 max-h-[88%] overflow-y-auto"><div class="w-10 h-1 bg-slate-300 rounded-full mx-auto mb-4"></div><YBody /></div></div></FxSheet></template>
  </Shell>` };

// ---------- Variant Z: open in place inside the list, swipe for actions, questions right in the row ----------
const VariantZ = { name: 'In place + swipe', components: { Shell, CatBadge, Question, Facts, EditForm, ItemList }, setup() {
    const open = ref(null), editing = ref(null), confirmDel = ref(null), swipe = reactive({ id: null, x: 0, start: 0 });
    const down = (i, e) => { swipe.id = i.id; swipe.start = e.clientX; swipe.x = 0; };
    const move = e => { if (swipe.id != null) swipe.x = Math.max(-140, Math.min(100, e.clientX - swipe.start)); };
    const up = i => { if (swipe.id !== i.id) return; const x = swipe.x; swipe.id = null; swipe.x = 0;
      if (x > 70) A.handled(i); else if (x < -110 && canRemove(i)) A.archive(i); else if (Math.abs(x) < 5) { open.value = open.value === i ? null : i; editing.value = null; } };
    const save = () => { A.save(open.value, editing.value); editing.value = null; };
    if (startOpen()) open.value = startOpen();
    return { ...H, open, editing, confirmDel, swipe, down, move, up, save };
  },
  template: `<Shell title="Z · In place + swipe">
    <template #list>
      <div class="px-4 pt-2 text-xs text-slate-400">Swipe a row right = Handled, left = Archive. Tap to open.</div>
      <ItemList :selected="open"><template #row="{ i }">
        <div class="relative overflow-hidden select-none" @pointermove="move" @pointerup="up(i)" @pointerleave="swipe.id===i.id && up(i)">
          <div class="absolute inset-0 flex justify-between items-center px-5 text-sm text-white" :class="swipe.id===i.id && swipe.x>0 ? 'bg-emerald-500' : 'bg-slate-500'">
            <span>✓ {{ i.handledBy ? 'Undo' : 'Handled' }}</span><span>{{ canRemove(i) ? 'Archive' : 'Owners only' }}</span></div>
          <div @pointerdown="down(i,$event)" :style="{ transform: 'translateX(' + (swipe.id===i.id ? swipe.x : 0) + 'px)' }" :class="open===i ? 'bg-slate-50' : 'bg-white'" class="relative flex items-center gap-3 pr-4 py-2.5 cursor-pointer transition-transform">
            <span :class="dayColor(daysTo(i.due), i.handledBy).bar" class="w-1.5 self-stretch rounded-r-full"></span>
            <CatBadge :c="i.category" />
            <div class="flex-1 min-w-0"><div class="font-medium truncate" :class="i.handledBy ? 'line-through text-slate-400' : ''">{{ i.name }}</div>
              <div class="text-xs truncate" :class="dayColor(daysTo(i.due), i.handledBy).text">{{ countdown(i) }}<span class="text-slate-400"> · Due {{ fmt(i.due) }}</span></div></div>
            <span class="text-slate-300">{{ open===i ? '▾' : '▸' }}</span>
          </div>
        </div>
        <div :class="open===i ? 'bg-slate-50' : ''"><Question :i="i" look="inline" /></div>
        <div v-if="open===i" class="bg-slate-50 pl-14 pr-4 pb-4 @3xl:hidden">
          <Facts :i="i" />
          <div class="flex gap-2 mt-3 text-sm"><button @click="editing = formFrom(i)" class="flex-1 bg-slate-900 text-white rounded-xl py-2">Edit</button>
            <button :disabled="!canRemove(i)" @click="confirmDel=i" class="flex-1 border border-red-200 text-red-600 rounded-xl py-2 disabled:opacity-40">Delete</button></div>
        </div>
      </template></ItemList>
    </template>
    <template #panel>
      <div v-if="open && !editing" class="max-w-lg mx-auto bg-white rounded-2xl shadow-sm p-6">
        <div class="flex items-center gap-3 mb-3"><CatBadge :c="open.category" size="lg" /><h2 class="text-2xl font-bold">{{ open.name }}</h2></div>
        <Facts :i="open" />
        <div class="flex gap-2 mt-4 text-sm"><button @click="editing = formFrom(open)" class="bg-slate-900 text-white rounded-xl px-4 py-2">Edit</button>
          <button :disabled="!canRemove(open)" @click="confirmDel=open" class="border border-red-200 text-red-600 rounded-xl px-4 py-2 disabled:opacity-40">Delete</button></div></div>
      <div v-else-if="editing" class="max-w-lg mx-auto bg-white rounded-2xl shadow-sm p-6"><h2 class="text-xl font-semibold mb-4">Edit Item</h2><EditForm :f="editing" />
        <div class="flex gap-2 mt-5"><button @click="save" class="bg-slate-900 text-white rounded-xl px-5 py-2.5">Save</button><button @click="editing=null" class="px-5 py-2.5">Cancel</button></div></div>
      <div v-else class="h-full grid place-items-center text-slate-400">Tap an Item</div>
    </template>
    <template #overlay>
      <div v-if="editing" class="@3xl:hidden fixed inset-0 z-20 bg-black/40 flex items-end" @click.self="editing=null">
        <div class="bg-white w-full rounded-t-3xl p-5 max-h-[90%] overflow-y-auto"><h2 class="text-xl font-semibold mb-4">Edit Item</h2><EditForm :f="editing" />
          <button @click="save" class="w-full mt-5 bg-slate-900 text-white rounded-xl py-3 mb-10">Save</button></div></div>
      <div v-if="confirmDel" class="fixed inset-0 z-30 bg-black/40 grid place-items-center p-6" @click.self="confirmDel=null">
        <div class="bg-white rounded-2xl p-5 max-w-sm"><div class="font-semibold text-lg">Delete {{ confirmDel.name }}?</div>
          <p class="text-sm text-slate-500 mt-1">Gone for good. Past Expenses stay in history.</p>
          <div class="flex gap-2 mt-4"><button @click="A.remove(confirmDel); confirmDel=null; open=null" class="flex-1 bg-red-600 text-white rounded-xl py-2">Delete</button><button @click="confirmDel=null" class="flex-1 border rounded-xl py-2">Keep</button></div></div></div>
    </template>
  </Shell>` };

// ---------- switcher + device frame ----------
const VARIANTS = { W: VariantW, X: VariantX, Y: VariantY, Z: VariantZ };
createApp({
  components: { ...VARIANTS, ...FX_COMPONENTS },
  setup() {
    const params = new URLSearchParams(location.search);
    const variant = ref(VARIANTS[params.get('variant')] ? params.get('variant') : 'W');
    const device = ref(params.get('device') === 'computer' ? 'computer' : 'phone');
    const showState = ref(false), keys = Object.keys(VARIANTS);
    const sync = () => { const p = new URLSearchParams(location.search); p.set('variant', variant.value); p.set('device', device.value); history.replaceState(null, '', '?' + p); };
    watch([variant, device], sync); sync();
    const cycle = d => { variant.value = keys[(keys.indexOf(variant.value) + d + keys.length) % keys.length]; };
    const onKey = e => { if (e.target.closest('input,textarea,select,[contenteditable]')) return; if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1); };
    onMounted(() => addEventListener('keydown', onKey)); onUnmounted(() => removeEventListener('keydown', onKey));
    const stateDump = computed(() => JSON.stringify({ variant: variant.value, lastActions: store.log,
      items: store.items.map(i => ({ name: i.name, category: i.category, due: fmt(i.due), recur: i.recur || 'once', handledBy: i.handledBy, archived: i.archived, reminders: i.reminders })) }, null, 1));
    return { variant, device, showState, cycle, VARIANTS, stateDump, store };
  },
  template: `<div class="min-h-screen grid place-items-center py-4">
    <div class="frame @container bg-white overflow-hidden shadow-2xl"
      :class="device==='phone' ? 'w-[390px] h-[min(844px,calc(100vh-6rem))] rounded-[2.5rem] border-[10px] border-slate-900' : 'w-[calc(100vw-2rem)] h-[calc(100vh-6rem)] rounded-xl'">
      <component :is="variant" :key="variant" />
      <FxPop><div v-if="store.toast" :key="store.toast.text" class="fixed bottom-6 left-4 right-4 @3xl:left-auto @3xl:w-80 z-40 bg-slate-900 text-white rounded-xl px-4 py-3 text-sm flex justify-between">
        <span>{{ store.toast.text }}</span><button @click="store.toast.undo(); store.toast=null" class="underline">Undo</button></div></FxPop>
    </div>
    <div class="fixed bottom-3 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 bg-black text-white rounded-full px-2 py-1.5 shadow-xl text-sm font-mono">
      <button @click="cycle(-1)" class="px-2">←</button>
      <span class="min-w-[13rem] text-center">{{ variant }} ({{ VARIANTS[variant].name }})</span>
      <button @click="cycle(1)" class="px-2">→</button>
      <span class="w-px h-5 bg-white/30"></span>
      <button @click="device = device==='phone' ? 'computer' : 'phone'" class="px-2">{{ device==='phone' ? '📱 Phone' : '💻 Computer' }}</button>
      <button @click="showState=!showState" class="px-2 opacity-70">state</button>
    </div>
    <pre v-if="showState" class="fixed top-2 right-2 z-50 max-h-[80vh] w-80 overflow-auto bg-black/85 text-green-300 text-[10px] p-3 rounded-lg">{{ stateDump }}</pre>
  </div>`,
}).mount('#app');
</script>
</body>
