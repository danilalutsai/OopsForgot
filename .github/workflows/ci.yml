name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  integration:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,vector,logflare
      - name: Serve Edge Functions in test mode
        run: |
          nohup pnpm functions:serve > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/send-reminders || true)
            [ "$code" = "403" ] && exit 0
            sleep 2
          done
          cat functions.log; exit 1
      - run: pnpm test:integration

  e2e:
    name: End-to-end tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,vector,logflare
      - name: Serve Edge Functions in test mode
        run: |
          nohup pnpm functions:serve > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/send-reminders || true)
            [ "$code" = "403" ] && exit 0
            sleep 2
          done
          cat functions.log; exit 1
      - run: cp .env.example .env.local
      - run: pnpm --filter @oopsforgot/app exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: app/test-results
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: [checks, integration, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Fresh encrypted backup
        env:
          GH_TOKEN: ${{ secrets.BACKUPS_DISPATCH_TOKEN }}
        run: scripts/backup-now.sh

      - name: Database migrations
        run: |
          # IPv4 address through Supabase's pooler: runners have no IPv6
          url=$(scripts/pooler-url.sh)
          echo "::add-mask::$url"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -X -q -t \
            "host=aws-1-eu-central-1.pooler.supabase.com port=5432 user=postgres.$PROJECT_REF dbname=postgres sslmode=require" \
            -c 'select 1' >/dev/null \
            || { echo "::error::Can't log in to the database: check the SUPABASE_DB_PASSWORD secret"; exit 1; }
          pnpm exec supabase db push --remote="$url" --yes

      - name: Edge Functions
        run: |
          if [ -d supabase/functions ] && [ -n "$(ls -A supabase/functions)" ]; then
            pnpm exec supabase functions deploy --remote="$PROJECT_REF" --yes
          else
            echo "No Edge Functions yet"
          fi

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: pnpm build

      - name: Web app to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.164.0 pages deploy app/dist --project-name oopsforgot --branch main --commit-dirty=true

      - name: Check the live app
        run: |
          # the address lives in one place: shared/src/app-url.ts
          app_url=$(sed -n "s/^export const APP_URL = '\(.*\)'$/\1/p" shared/src/app-url.ts)
          test -n "$app_url"
          curl -fsS "$app_url/" | grep -q '<div id="app">'
          curl -fsS -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/keep_alive" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" -H "Content-Type: application/json" -d '{}'
          # the Edge Functions answer: the sender refuses strangers, the feed refuses bad links
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST '${{ vars.SUPABASE_URL }}/functions/v1/send-reminders')" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' '${{ vars.SUPABASE_URL }}/functions/v1/calendar-feed?token=x')" = 404

      - name: Check the push key
        env:
          KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          # a public push key is 65 bytes; a key cut short when pasting breaks push for everyone
          size=$(node -e "console.log(Buffer.from(process.env.KEY, 'base64url').length)")
          [ "$size" = 65 ] || { echo "::error::VAPID_PUBLIC_KEY decodes to $size bytes, not 65: paste the whole key (variable and Edge Function secret)"; exit 1; }
