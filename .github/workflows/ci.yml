name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  integration:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,vector,logflare
      - name: Serve Edge Functions in test mode
        run: |
          nohup pnpm functions:serve > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/send-reminders || true)
            [ "$code" = "403" ] && exit 0
            sleep 2
          done
          cat functions.log; exit 1
      - run: pnpm test:integration

  e2e:
    name: End-to-end tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,vector,logflare
      - name: Serve Edge Functions in test mode
        run: |
          nohup pnpm functions:serve > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/send-reminders || true)
            [ "$code" = "403" ] && exit 0
            sleep 2
          done
          cat functions.log; exit 1
      - run: cp .env.example .env.local
      - run: pnpm --filter @oopsproof/app exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e

  deploy:
    name: Deploy to production
    needs: [checks, integration, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Fresh encrypted backup
        env:
          GH_TOKEN: ${{ secrets.BACKUPS_DISPATCH_TOKEN }}
        run: scripts/backup-now.sh

      - name: Database migrations
        run: |
          pnpm exec supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          pnpm exec supabase db push -p "$SUPABASE_DB_PASSWORD"

      - name: Edge Functions
        run: |
          if [ -d supabase/functions ] && [ -n "$(ls -A supabase/functions)" ]; then
            pnpm exec supabase functions deploy --project-ref "$PROJECT_REF"
          else
            echo "No Edge Functions yet"
          fi

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: pnpm build

      - name: Web app to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.164.0 pages deploy app/dist --project-name oopsproof --branch main --commit-dirty=true

      - name: Check the live app
        run: |
          curl -fsS https://oopsproof.pages.dev/ | grep -q '<div id="app">'
          curl -fsS -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/keep_alive" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" -H "Content-Type: application/json" -d '{}'
          # the Edge Functions answer: the sender refuses strangers, the feed refuses bad links
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST '${{ vars.SUPABASE_URL }}/functions/v1/send-reminders')" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' '${{ vars.SUPABASE_URL }}/functions/v1/calendar-feed?token=x')" = 404
